<script>
(function(){
  try{
    const params = new URLSearchParams(window.location.search);
    let savedTrip = localStorage.getItem("dovolenka_trip");
    if (!savedTrip) {
      const match = document.cookie.match(/(?:^|; )dovolenka_trip=([^;]*)/);
      savedTrip = match ? decodeURIComponent(match[1]) : "";
    }
    if (!params.get("trip") && savedTrip) {
      const url = new URL(window.location.href);
      url.searchParams.set("trip", savedTrip);
      window.history.replaceState({}, "", url.toString());
    }
  } catch (e) {
    // Never block application startup.
  }
})();
</script>

<script>
const SUPABASE_URL="https://jyirzhycpdwsxgzfzues.supabase.co",SUPABASE_KEY="sb_publishable_Wwps6w2vA2CynxVLucrWKw_p9uYxrjx";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const cats=[["🍝","Jedlo"],["🍹","Drink"],["🏨","Ubytovanie"],["🚗","Doprava"],["🎟️","Aktivity"],["🛒","Nákupy"],["⛽","Palivo"],["🅿️","Parkovanie"],["✈️","Letenky"],["📦","Ostatné"]];
let trip=null,expenses=[],editing=null,cat="Jedlo";
const money=n=>new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>a&&b?Math.floor((new Date(b)-new Date(a))/86400000)+1:0;
function code(){return crypto.randomUUID().replaceAll("-","").slice(0,10).toUpperCase()}
function params(){return new URLSearchParams(location.search).get("trip")}
function savedTripCookie(){
  const m=document.cookie.match(/(?:^|; )dovolenka_trip=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : "";
}
async function init(){
  let c=params() || localStorage.getItem("dovolenka_trip") || savedTripCookie();
  if(!c)return landing();
  let r=await db.rpc("get_trip",{p_share_code:c});
  if(r.error||!r.data){
    localStorage.removeItem("dovolenka_trip");
    document.cookie="dovolenka_trip=; path=/; max-age=0; SameSite=Lax";
    return landing(r.error?.message||"Tracker sa nenašiel.");
  }
  localStorage.setItem("dovolenka_trip",c);
  document.cookie="dovolenka_trip="+encodeURIComponent(c)+"; path=/; max-age=31536000; SameSite=Lax";
  trip=r.data.trip;
  expenses=r.data.expenses||[];
  render();
}
async function landing(msg){document.getElementById("app").innerHTML=`<div class="card"><h1>🏖️ Dovolenka Tracker</h1><p class="muted">${msg||"Vytvor si zdieľaný tracker pre dovolenku."}</p><button class="primary" onclick="createTrip()">＋ Vytvoriť dovolenku</button></div>`}
async function createTrip(){let n=prompt("Názov dovolenky","Moja dovolenka")||"Moja dovolenka";let r=await db.rpc("create_trip",{p_name:n});if(r.error)return alert(r.error.message);trip=r.data;localStorage.setItem("dovolenka_trip",trip.share_code);document.cookie="dovolenka_trip="+encodeURIComponent(trip.share_code)+"; path=/; max-age=31536000; SameSite=Lax";history.replaceState({},"","?trip="+trip.share_code);await load();render()}
async function load(){let r=await db.rpc("get_trip",{p_share_code:trip.share_code});if(r.error)throw new Error(r.error.message);trip=r.data.trip;expenses=r.data.expenses||[]}
function dateList(){let n=days(trip.start_date,trip.end_date);if(!n)return [...new Set(expenses.map(e=>e.expense_date))].sort();return Array.from({length:n},(_,i)=>{let d=new Date(trip.start_date+"T00:00:00");d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)})}
function render(){
  const total =
    expenses.reduce((a,e)=>a+Number(e.amount||0),0);

  const fixed =
    expenses
      .filter(e=>e.fixed)
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const variableSpent =
    Math.max(0,total-fixed);

  const budget =
    Number(trip.budget||0);

  const remaining =
    budget-total;

  const tripDays =
    days(trip.start_date,trip.end_date);

  const todaySpent =
    expenses
      .filter(e=>e.expense_date===today())
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const todayVariableSpent =
    expenses
      .filter(e=>e.expense_date===today() && !e.fixed)
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const activeToday =
    trip.start_date &&
    trip.end_date &&
    today() >= trip.start_date &&
    today() <= trip.end_date;

  const daysLeft =
    tripDays > 0
      ? Math.max(0, Math.ceil((new Date(trip.end_date+"T00:00:00") - new Date(today()+"T00:00:00")) / 86400000) + 1)
      : 0;

  const variableBudget =
    Math.max(0,budget-fixed);

  // Base daily allowance: total budget minus fixed expenses,
  // divided by the number of vacation days.
  const dailyBudget =
    tripDays > 0
      ? variableBudget / tripDays
      : 0;

  const variableRemaining =
    Math.max(0,variableBudget-variableSpent);

  const remainingDays =
    activeToday
      ? Math.max(1,daysLeft)
      : today() < trip.start_date
        ? Math.max(1,tripDays)
        : 0;

  // Dynamic allowance: what can still be spent per remaining vacation day.
  const adaptiveDailyBudget =
    remainingDays > 0
      ? variableRemaining / remainingDays
      : 0;

  // What is still available today after today's variable spending.
  const todayRemaining =
    activeToday
      ? Math.max(0,adaptiveDailyBudget-todayVariableSpent)
      : adaptiveDailyBudget;

  const totalPercent =
    budget > 0
      ? Math.min(100,total/budget*100)
      : 0;

  document.getElementById("app").innerHTML = `
    <div class="top">
      <div>
        <h1><span id="tripFlag">🇮🇹</span> ${esc(trip.name)}</h1>
        <div class="muted">
          ${trip.start_date||"—"} – ${trip.end_date||"—"} · EUR
        </div>
      </div>
      <button class="ghost" onclick="openSettings()">⚙️</button>
    </div>

    <div class="card hero">
      <div class="muted">Celkom minuté</div>
      <div class="total">${money(total)}</div>

      <div class="bar">
        <i style="width:${totalPercent}%"></i>
      </div>

      <div class="compact-kpis">
        <div>
          <small>Zostáva z rozpočtu</small>
          <b>${money(remaining)}</b>
        </div>
        <div>
          <small>Dnes môžeš minúť</small>
          <b>${money(adaptiveDailyBudget)}</b>
        </div>
      </div>

      <div class="today-mini ${activeToday && todayVariableSpent>adaptiveDailyBudget ? "over" : activeToday && todayVariableSpent>adaptiveDailyBudget*0.8 ? "warning" : ""}">
        <span>🎯 Dnes minuté <b>${money(todayVariableSpent)}</b></span>
        <span>${activeToday ? "Zostáva "+money(todayRemaining) : money(adaptiveDailyBudget)+" / deň"}</span>
      </div>

      <div class="trip-status compact-status">
        <span>💡</span>
        <div>
          <b>
            ${activeToday
              ? "Zostáva "+daysLeft+" "+(daysLeft===1?"deň":"dní")
              : today() < trip.start_date ? `Dovolenka začína ${new Date(trip.start_date+"T00:00:00").toLocaleDateString("sk-SK")}` : `Dovolenka skončila ${new Date(trip.end_date+"T00:00:00").toLocaleDateString("sk-SK")}`}
          </b>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">
        <b>DNES</b>
        <b>${money(todaySpent)}</b>
      </div>
      <div id="today"></div>
    </div>

    <div class="card">
      <div class="section-head">
        <b>VYSPORIADANIE</b>
        <span class="muted">kto reálne zaplatil</span>
      </div>
      <div class="kpi-grid">
        <div class="kpi">
          <small>👤 ${esc(trip.person1)} zaplatil</small>
          <b>${money(paidBy(trip.person1))}</b>
        </div>
        <div class="kpi">
          <small>👤 ${esc(trip.person2)} zaplatil</small>
          <b>${money(paidBy(trip.person2))}</b>
        </div>
      </div>
      <div class="settlement-note">🤝 „Platené spolu“ sa započítava 50/50.</div><div id="settle" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div class="top">
        <b>POSLEDNÉ VÝDAVKY</b>
        <span class="muted">${expenses.length}</span>
      </div>
      <div id="history"></div>
    </div>



    <div class="card">
      <div class="section-head">
        <b>📊 KATEGÓRIE</b>
        <span class="muted">${money(total)}</span>
      </div>
      <div id="categorySummary"></div>
    </div>
    <div class="card days-card" id="daysCard">
      <button class="days-toggle" type="button" onclick="toggleDays()" aria-expanded="false" aria-controls="daysContent">
        <span class="days-toggle-title">
          <span aria-hidden="true">📅</span>
          <span>
            <b>DNI DOVOLENKY</b>
            <small id="daysSummary">Dni dovolenky</small>
          </span>
        </span>
        <span class="days-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="daysContent" class="days-content" hidden>
        <div id="days"></div>
      </div>
    </div>











    <div class="card">
      <b>ZDIEĽAŤ TRACKER</b>
      <div class="share" style="margin-top:10px">
        <input id="shareUrl" readonly value="${esc(location.href)}">
        <button class="ghost" onclick="copyShare()">Kopírovať</button>
      </div>
    </div>
  `;

  renderLists();
  renderCategories();
  renderSettlement();
}
function categoryEmoji(name){
  const item=cats.find(x=>x[1]===name);
  return item ? item[0] : "📦";
}
function row(e){
  const c=cats.find(x=>x[1]===e.category)||["📦",e.category||"Ostatné"];
  const status=e.settlement_status||"Nevyrovnané";
  const statusIcon=status==="Platené spolu"?"🤝":status==="Vyrovnané"?"🟢":"🔴";
  return `<div class="exp">
    <div class="ico">${c[0]}</div>
    <div class="info">
      <b>${esc(e.category||"Ostatné")} · ${money(e.amount)}</b>
      <small>${esc(e.note||"Bez poznámky")} · 👤 ${esc(e.payer||"")} · ${e.payment==="Hotovosť"?"💶":"💳"} · ${statusIcon}</small>
    </div>
    <div class="acts">
      <button type="button" class="ghost mini" onclick="openExpense('${e.id}')" aria-label="Upraviť">✏️</button>
      <button type="button" class="ghost mini" onclick="delExpense('${e.id}')" aria-label="Vymazať">🗑️</button>
    </div>
  </div>`;
}
function toggleDays(){
  const content=document.getElementById("daysContent");
  const card=document.getElementById("daysCard");
  const btn=card?.querySelector(".days-toggle");
  if(!content || !btn) return;
  const open=content.hidden;
  content.hidden=!open;
  btn.setAttribute("aria-expanded", String(open));
  card.classList.toggle("expanded", open);
}

function updateDaysSummary(){
  const el=document.getElementById("daysSummary");
  if(!el) return;
  const s=trip?.start_date, e=trip?.end_date;
  if(s && e){
    const a=new Date(s+"T00:00:00"), b=new Date(e+"T00:00:00");
    const n=Math.floor((b-a)/86400000)+1;
    if(Number.isFinite(n) && n>0) {
      el.textContent=`${s.slice(8,10)}.${s.slice(5,7)}. – ${e.slice(8,10)}.${e.slice(5,7)}. · ${n} dní`;
      return;
    }
  }
  el.textContent="Dátumy zatiaľ nie sú nastavené";
}

function renderLists(){
  const todayEl=document.getElementById("today");
  const historyEl=document.getElementById("history");
  const daysEl=document.getElementById("days");

  // These three sections render independently so one bad/empty date
  // cannot prevent Categories or Vacation Days from appearing.
  if(todayEl){
    try{
      todayEl.innerHTML =
        expenses
          .filter(e=>e.expense_date===today())
          .map(row)
          .join("")
        || '<div class="muted" style="padding-top:12px">Dnes zatiaľ žiadny výdavok.</div>';
    }catch(err){
      console.error("Dnes:",err);
      todayEl.innerHTML='<div class="muted" style="padding-top:12px">Nepodarilo sa načítať dnešné výdavky.</div>';
    }
  }

  if(historyEl){
    try{
      historyEl.innerHTML =
        [...expenses]
          .sort((a,b)=>new Date(b.expense_date)-new Date(a.expense_date))
          .slice(0,15)
          .map(row)
          .join("")
        || '<div class="muted" style="padding-top:12px">Zatiaľ žiadne výdavky.</div>';
    }catch(err){
      console.error("História:",err);
      historyEl.innerHTML='<div class="muted" style="padding-top:12px">Nepodarilo sa načítať výdavky.</div>';
    }
  }

  updateDaysSummary();
  if(daysEl){
    try{
      const startDate=trip.start_date;
      const endDate=trip.end_date;
      let dl=[];

      if(startDate && endDate){
        const first=new Date(startDate+"T00:00:00");
        const last=new Date(endDate+"T00:00:00");
        const count=Math.floor((last-first)/86400000)+1;

        if(Number.isFinite(count) && count>0 && count<=366){
          for(let i=0;i<count;i++){
            const d=new Date(first);
            d.setDate(first.getDate()+i);
            dl.push(d.toISOString().slice(0,10));
          }
        }
      }

      if(!dl.length){
        dl=[...new Set(expenses.map(e=>e.expense_date).filter(Boolean))].sort();
      }

      const totalBudget=Number(trip.budget||0);
      const fixedTotal=expenses
        .filter(e=>e.fixed)
        .reduce((a,e)=>a+Number(e.amount||0),0);

      const fixedPerDay=dl.length ? fixedTotal/dl.length : 0;
      const variableBudget=Math.max(0,totalBudget-fixedTotal);
      const variablePerDay=dl.length ? variableBudget/dl.length : 0;
      const totalPerDay=dl.length ? totalBudget/dl.length : 0;

      daysEl.innerHTML=dl.length
        ? dl.map((d,i)=>{
            const variableSpent=expenses
              .filter(e=>e.expense_date===d && !e.fixed)
              .reduce((a,e)=>a+Number(e.amount||0),0);

            const fixedOnDate=expenses
              .filter(e=>e.expense_date===d && e.fixed)
              .reduce((a,e)=>a+Number(e.amount||0),0);

            const plannedTotal=fixedPerDay+variablePerDay;
            const dayTotal=fixedPerDay+variableSpent;
            const over=dayTotal>plannedTotal && plannedTotal>0;

            return `
              <div class="day ${d===today()?"selected":""}${over?" over":""}">
                <div class="day-main">
                  <small>${i+1}. deň · ${d.slice(8,10)}.${d.slice(5,7)}.</small>
                  <b>${money(dayTotal)}</b>
                </div>
                <div class="day-meta">
                  <span>Fixné ${money(fixedPerDay)}</span>
                  <span>Bežné ${money(variableSpent)}</span>
                  <span>plán ${money(plannedTotal)}</span>
                </div>
                ${fixedOnDate>0 ? `<em>Fixné reálne zaplatené ${money(fixedOnDate)}</em>` : ""}
              </div>
            `;
          }).join("")
        : "<span class='muted'>Dátumy dovolenky zatiaľ nie sú nastavené.</span>";
    }catch(err){
      console.error("Dni dovolenky:",err);
      daysEl.innerHTML="<span class='muted'>Nepodarilo sa načítať dni dovolenky.</span>";
    }
  }

}

function paidBy(person){
  // Pri "Platené spolu" sa výdavok započíta každému iba z 50 %.
  // Pri výdavku platenom jednou osobou sa započíta celá suma platiteľovi.
  return expenses.reduce((total,e)=>{
    const amount=Number(e.amount||0);
    const status=e.settlement_status||"Nevyrovnané";

    if(status==="Platené spolu"){
      return total + amount/2;
    }

    return total + ((e.payer||"")===person ? amount : 0);
  },0);
}function renderSettlement(){
  const el=document.getElementById("settle");
  if(!el) return;

  const p1=trip.person1||"Ja";
  const p2=trip.person2||"Partner";

  let p1Share=0;
  let p2Share=0;
  let p1Paid=0;
  let p2Paid=0;

  expenses.forEach(e=>{
    const amount=Number(e.amount||0);
    const status=e.settlement_status||"Nevyrovnané";

    if(status==="Vyrovnané") return;

    if(status==="Platené spolu"){
      p1Share += amount/2;
      p2Share += amount/2;
      p1Paid += amount/2;
      p2Paid += amount/2;
      return;
    }

    if(e.payer===p1){
      p1Paid += amount;
      p1Share += amount/2;
      p2Share += amount/2;
    }else if(e.payer===p2){
      p2Paid += amount;
      p1Share += amount/2;
      p2Share += amount/2;
    }
  });

  const balance1=p1Paid-p1Share;
  const balance2=p2Paid-p2Share;

  if(Math.abs(balance1)<0.005){
    el.innerHTML =
      '<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>Ste vyrovnaní</b></div>';
    return;
  }

  if(balance1>0){
    el.innerHTML =
      `<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>${esc(p2)} má doplatiť ${money(balance1)}</b></div>`;
  }else{
    el.innerHTML =
      `<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>${esc(p1)} má doplatiť ${money(Math.abs(balance1))}</b></div>`;
  }
}

function renderCategories(){
  const el=document.getElementById("categorySummary");
  if(!el) return;

  try{
    const totals={};

    expenses.forEach(e=>{
      const name=String(e.category||"Ostatné");
      totals[name]=(totals[name]||0)+Number(e.amount||0);
    });

    const rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]);

    if(!rows.length){
      el.innerHTML='<div class="muted" style="padding-top:12px">Zatiaľ žiadne výdavky.</div>';
      return;
    }

    const total=rows.reduce((s,x)=>s+x[1],0);

    el.innerHTML=rows.map(([name,value])=>{
      const pct=total>0 ? value/total*100 : 0;
      return `
        <div class="category-row">
          <div class="category-row-head">
            <span>${categoryEmoji(name)} ${esc(name)}</span>
            <b>${money(value)} · ${pct.toFixed(0)} %</b>
          </div>
          <div class="category-track">
            <i style="width:${Math.min(100,Math.max(0,pct))}%"></i>
          </div>
        </div>
      `;
    }).join("");
  }catch(err){
    console.error("Kategórie:",err);
    el.innerHTML='<div class="muted" style="padding-top:12px">Nepodarilo sa načítať kategórie.</div>';
  }
}
function copyShare(){
  navigator.clipboard
    .writeText(location.href)
    .then(()=>alert("Odkaz bol skopírovaný."))
    .catch(()=>alert(location.href));
}

function openExpense(id){
editing=id?expenses.find(e=>e.id===id):null;
cat=editing?.category||"Jedlo";
document.getElementById("modalTitle").textContent=editing?"Upraviť výdavok":"Pridať výdavok";
document.getElementById("amount").value=editing?.amount||"";
document.getElementById("date").value=editing?.expense_date||today();
setTimeout(()=>document.getElementById("amount")?.focus(),80);
document.getElementById("note").value=editing?.note||"";
document.getElementById("fixed").checked=!!editing?.fixed;
document.getElementById("payment").value=editing?.payment||"Karta";
document.getElementById("settlement").value=editing?.settlement_status||"Nevyrovnané";
document.getElementById("payer").innerHTML=`<option>${esc(trip.person1)}</option><option>${esc(trip.person2)}</option>`;
document.getElementById("payer").value=editing?.payer||trip.person1;
renderCats();
document.getElementById("modal").classList.add("open")
}
function renderCats(){
  const el = document.getElementById("cats");
  if(!el) return;

  el.innerHTML = cats.map(function(x,i){
    return `
      <button
        type="button"
        class="cat ${cat === x[1] ? "sel" : ""}"
        data-cat-index="${i}"
        aria-pressed="${cat === x[1] ? "true" : "false"}"
      >
        <span>${x[0]}</span>
        ${x[1]}
      </button>
    `;
  }).join("");
}

document.addEventListener("click",function(e){
  const btn=e.target.closest("#cats .cat");
  if(!btn) return;

  e.preventDefault();
  e.stopPropagation();

  const index=Number(btn.dataset.catIndex);
  if(!Number.isInteger(index) || !cats[index]) return;

  cat=cats[index][1];

  document.querySelectorAll("#cats .cat").forEach(function(b){
    const selected=Number(b.dataset.catIndex)===index;
    b.classList.toggle("sel",selected);
    b.setAttribute("aria-pressed",selected?"true":"false");
  });
});

async function saveExpense(){let amount=Number(document.getElementById("amount").value);if(!amount)return alert("Zadaj sumu.");let obj={p_share_code:trip.share_code,p_amount:amount,p_category:cat,p_expense_date:document.getElementById("date").value,p_note:document.getElementById("note").value.trim(),p_fixed:document.getElementById("fixed").checked,p_payer:document.getElementById("payer").value,p_payment:document.getElementById("payment").value,p_settlement_status:document.getElementById("settlement").value};let r=editing?await db.rpc("update_expense",{...obj,p_expense_id:editing.id}):await db.rpc("add_expense",obj);if(r.error)return alert(r.error.message);closeModal();await load();render()}
async function delExpense(id){if(!confirm("Vymazať výdavok?"))return;let r=await db.rpc("delete_expense",{p_share_code:trip.share_code,p_expense_id:id});if(r.error)return alert(r.error.message);await load();render()}
function openSettings(){sname.value=trip.name;sbudget.value=trip.budget;sp1.value=trip.person1;sp2.value=trip.person2;sstart.value=trip.start_date||"";send.value=trip.end_date||"";document.getElementById("settings").classList.add("open")}
async function saveSettings(){if(sstart.value&&send.value&&send.value<sstart.value)return alert("Koniec nemôže byť pred začiatkom.");let r=await db.rpc("update_trip",{p_share_code:trip.share_code,p_name:sname.value,p_budget:Number(sbudget.value)||0,p_person1:sp1.value||"Ja",p_person2:sp2.value||"Partner",p_start_date:sstart.value||null,p_end_date:send.value||null});if(r.error)return alert(r.error.message);closeSettings();await load();render()}
function closeModal(){document.getElementById("modal").classList.remove("open")}function closeSettings(){document.getElementById("settings").classList.remove("open")}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
