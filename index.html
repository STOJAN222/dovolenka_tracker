<style>
body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}.app{max-width:620px;margin:auto;padding:18px 14px 70px}
.card{background:#fff;border:1px solid #e5e9ef;border-radius:18px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.muted{color:#718096;font-size:13px}
h1{margin:0;font-size:25px}.hero{border-radius:22px;padding:20px;background:#fff}.total{font-size:38px;font-weight:850}.bar{height:10px;background:#edf0f4;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#2563eb}.daily{background:#eef4ff;border-radius:15px;padding:13px;margin-top:13px}.daily b{font-size:22px}
button{font:inherit;font-weight:750;border:0;border-radius:12px;padding:11px 14px;cursor:pointer}.primary{background:#2563eb;color:#fff}.ghost{background:#fff;border:1px solid #dce2e9}.add{width:100%;margin:12px 0;font-size:16px;padding:15px}
.exp{display:flex;gap:9px;align-items:center;border-top:1px solid #eef0f2;padding:11px 0}.ico{font-size:22px;width:32px}.info{flex:1;min-width:0}.info b,.info small{display:block}.info small{color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.amt{font-weight:800;white-space:nowrap}.acts{display:flex;gap:4px}.mini{padding:6px 7px;font-size:12px}
.days{display:flex;gap:7px;overflow:auto}.day{min-width:58px;text-align:center;padding:9px 4px;background:#f7f8fa;border:1px solid #e5e9ef;border-radius:12px}.day b{display:block}.day small{color:#718096}.selected{background:#eef4ff;border-color:#c9d9ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#eef4ff;border-radius:14px;padding:12px}.tile small{display:block;color:#718096}.tile b{font-size:19px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5;overscroll-behavior:none}.modal.open{display:flex}.box{background:#fff;width:min(620px,100%);border-radius:22px 22px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-sizing:border-box}.form{display:grid;gap:11px}.form input,.form select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9dee6;border-radius:11px;font:inherit;font-size:16px}.form label{font-size:13px;font-weight:750}.actions2{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:4px;z-index:2}
.category-field{margin-bottom:2px}.category-field>label{display:block;margin-bottom:6px}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cat{appearance:none;-webkit-appearance:none;background:#f7f8fa;border:1px solid #e5e9ef;padding:10px 3px;font-size:11px;min-height:58px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.cat span{display:block;font-size:20px}.cat.sel{background:#eef4ff;border-color:#c9d9ff}
.share{display:flex;gap:8px;align-items:center;background:#f7f8fa;padding:10px;border-radius:12px}.share input{flex:1;border:0;background:transparent;font-size:12px}
@media(max-width:420px){.cats{grid-template-columns:repeat(3,1fr)}}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:#f7f8fa;border-radius:14px;padding:12px}
.kpi small{display:block;color:#718096;font-size:12px}
.kpi b{display:block;font-size:20px;margin-top:4px}
.kpi.accent{background:#eef4ff}
.kpi.accent b{color:#1d4ed8}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.category-row{margin-top:12px}
.category-row-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.category-track{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:6px}
.category-track i{display:block;height:100%;background:#2563eb;border-radius:99px}
@media(max-width:420px){.kpi-grid{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}}

<body><div class="app" id="app"><div class="muted">Načítavam…</div></div>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Pridať výdavok</h2><div class="form">
<label>Suma (€)<input id="amount" type="number" min=".01" step=".01"></label>
<div class="category-field"><label>Kategória</label><div class="cats" id="cats"></div></div>
<label>Dátum<input id="date" type="date"></label>
<label>Kto platil?<select id="payer"></select></label>
<label>Spôsob platby<select id="payment"><option>Karta</option><option>Hotovosť</option></select></label>
<label>Vyrovnanie<select id="settlement"><option>Nevyrovnané</option><option>Vyrovnané</option><option>Platené spolu</option></select></label>
<label>Poznámka<input id="note" placeholder="napr. večera"></label>
<label><input id="fixed" type="checkbox"> 🔒 Fixný výdavok</label>
<div class="actions2"><button class="ghost" onclick="closeModal()">Zrušiť</button><button class="primary" onclick="saveExpense()">Uložiť</button></div>
</div></div></div>
<div class="modal" id="settings"><div class="box"><h2>Nastavenie dovolenky</h2><div class="form">
<label>Názov<input id="sname"></label><label>Rozpočet (€)<input id="sbudget" type="number" step=".01"></label>
<label>Osoba 1<input id="sp1"></label><label>Osoba 2<input id="sp2"></label>
<label>Začiatok<input id="sstart" type="date"></label><label>Koniec<input id="send" type="date"></label>
<div class="actions2"><button class="ghost" onclick="closeSettings()">Zrušiť</button><button class="primary" onclick="saveSettings()">Uložiť</button></div>
</div></div></div>
<script>
const SUPABASE_URL="https://jyirzhycpdwsxgzfzues.supabase.co",SUPABASE_KEY="sb_publishable_Wwps6w2vA2CynxVLucrWKw_p9uYxrjx";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const cats=[["🍝","Jedlo"],["🍹","Drink"],["🏨","Ubytovanie"],["🚗","Doprava"],["🎟️","Aktivity"],["🛒","Nákupy"],["⛽","Palivo"],["🅿️","Parkovanie"],["✈️","Letenky"],["📦","Ostatné"]];
let trip=null,expenses=[],editing=null,cat="Jedlo";
const money=n=>new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>a&&b?Math.floor((new Date(b)-new Date(a))/86400000)+1:0;
function code(){return crypto.randomUUID().replaceAll("-","").slice(0,10).toUpperCase()}
function params(){return new URLSearchParams(location.search).get("trip")}
async function init(){
  let c=params() || localStorage.getItem("dovolenka_trip");
  if(!c)return landing();
  let r=await db.rpc("get_trip",{p_share_code:c});
  if(r.error||!r.data){
    localStorage.removeItem("dovolenka_trip");
    return landing(r.error?.message||"Tracker sa nenašiel.");
  }
  localStorage.setItem("dovolenka_trip",c);
  trip=r.data.trip;
  expenses=r.data.expenses||[];
  render();
}
async function landing(msg){document.getElementById("app").innerHTML=`<div class="card"><h1>🏖️ Dovolenka Tracker</h1><p class="muted">${msg||"Vytvor si zdieľaný tracker pre dovolenku."}</p><button class="primary" onclick="createTrip()">＋ Vytvoriť dovolenku</button></div>`}
async function createTrip(){let n=prompt("Názov dovolenky","Moja dovolenka")||"Moja dovolenka";let r=await db.rpc("create_trip",{p_name:n});if(r.error)return alert(r.error.message);trip=r.data;localStorage.setItem("dovolenka_trip",trip.share_code);history.replaceState({},"","?trip="+trip.share_code);await load();render()}
async function load(){let r=await db.rpc("get_trip",{p_share_code:trip.share_code});if(r.error)throw new Error(r.error.message);trip=r.data.trip;expenses=r.data.expenses||[]}
function dateList(){let n=days(trip.start_date,trip.end_date);if(!n)return [...new Set(expenses.map(e=>e.expense_date))].sort();return Array.from({length:n},(_,i)=>{let d=new Date(trip.start_date+"T00:00:00");d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)})}
function render(){
  const total =
    expenses.reduce((a,e)=>a+Number(e.amount||0),0);

  const fixed =
    expenses
      .filter(e=>e.fixed)
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const variableSpent =
    Math.max(0,total-fixed);

  const budget =
    Number(trip.budget||0);

  const remaining =
    budget-total;

  const tripDays =
    days(trip.start_date,trip.end_date);

  const todaySpent =
    expenses
      .filter(e=>e.expense_date===today())
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const todayVariableSpent =
    expenses
      .filter(e=>e.expense_date===today() && !e.fixed)
      .reduce((a,e)=>a+Number(e.amount||0),0);

  const activeToday =
    trip.start_date &&
    trip.end_date &&
    today() >= trip.start_date &&
    today() <= trip.end_date;

  const variableBudget =
    Math.max(0,budget-fixed);

  // Base daily allowance: total budget minus fixed expenses,
  // divided by the number of vacation days.
  const dailyBudget =
    tripDays > 0
      ? variableBudget / tripDays
      : 0;

  // What is still available today after today's variable spending.
  const todayRemaining =
    activeToday
      ? Math.max(0,dailyBudget-todayVariableSpent)
      : dailyBudget;

  const totalPercent =
    budget > 0
      ? Math.min(100,total/budget*100)
      : 0;

  document.getElementById("app").innerHTML = `
    <div class="top">
      <div>
        <h1><span id="tripFlag">🇮🇹</span> ${esc(trip.name)}</h1>
        <div class="muted">
          ${trip.start_date||"—"} – ${trip.end_date||"—"} · EUR
        </div>
      </div>
      <button class="ghost" onclick="openSettings()">⚙️</button>
    </div>

    <div class="card hero">
      <div class="muted">Celkom minuté</div>
      <div class="total">${money(total)}</div>

      <div class="bar">
        <i style="width:${totalPercent}%"></i>
      </div>

      <div class="grid2">
        <div>
          <div class="muted">Zostáva z rozpočtu</div>
          <b>${money(remaining)}</b>
        </div>
        <div>
          <div class="muted">Fixné výdavky</div>
          <b>${money(fixed)}</b>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi accent">
          <small>🎯 Dnes môžeš ešte minúť</small>
          <b>${money(todayRemaining)}</b>
        </div>
        <div class="kpi">
          <small>📅 Denný rozpočet</small>
          <b>${money(dailyBudget)}</b>
        </div>
      </div>

      <div class="daily">
        💡
        <b>
          ${activeToday
            ? "Zostáva "+daysLeft+" "+(daysLeft===1?"deň":"dní")
            : "Nastav dátumy dovolenky"}
        </b>
        <div class="muted">
          ${activeToday
            ? "Rozpočet po odpočítaní fixných výdavkov je rozdelený rovnomerne na dni dovolenky."
            : "Denný rozpočet sa zobrazí po nastavení dátumov."}
        </div>
      </div>
    </div>

    <button class="primary add" onclick="openExpense()">
      ＋ PRIDAŤ VÝDAVOK
    </button>

    <div class="card">
      <div class="section-head">
        <b>DNES</b>
        <b>${money(todaySpent)}</b>
      </div>
      <div id="today"></div>
    </div>

    <div class="card">
      <div class="section-head">
        <b>VYSPORIADANIE</b>
        <span class="muted">${esc(trip.person1)} + ${esc(trip.person2)}</span>
      </div>
      <div class="kpi-grid">
        <div class="kpi">
          <small>👤 ${esc(trip.person1)} zaplatil</small>
          <b>${money(paidBy(trip.person1))}</b>
        </div>
        <div class="kpi">
          <small>👤 ${esc(trip.person2)} zaplatil</small>
          <b>${money(paidBy(trip.person2))}</b>
        </div>
      </div>
      <div id="settle" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="section-head">
        <b>📊 KATEGÓRIE</b>
        <span class="muted">${money(total)}</span>
      </div>
      <div id="categorySummary"></div>
    </div>

    <div class="card">
      <b>SPÔSOB PLATBY</b>
      <div class="grid2" style="margin-top:10px">
        <div class="tile">
          <small>💳 Karta</small>
          <b>${money(
            expenses
              .filter(e=>e.payment==="Karta")
              .reduce((a,e)=>a+Number(e.amount||0),0)
          )}</b>
        </div>
        <div class="tile">
          <small>💶 Hotovosť</small>
          <b>${money(
            expenses
              .filter(e=>e.payment==="Hotovosť")
              .reduce((a,e)=>a+Number(e.amount||0),0)
          )}</b>
        </div>
      </div>
    </div>

    <div class="card">
      <b>📅 DNI DOVOLENKY</b>
      <div class="days" id="days" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="top">
        <b>POSLEDNÉ VÝDAVKY</b>
        <span class="muted">${expenses.length}</span>
      </div>
      <div id="history"></div>
    </div>

    <div class="card">
      <b>ZDIEĽAŤ TRACKER</b>
      <div class="share" style="margin-top:10px">
        <input id="shareUrl" readonly value="${esc(location.href)}">
        <button class="ghost" onclick="copyShare()">Kopírovať</button>
      </div>
    </div>
  `;

  renderLists();
  renderCategories();
  renderSettlement();
}
function categoryEmoji(name){
  const item=cats.find(x=>x[1]===name);
  return item ? item[0] : "📦";
}
function row(e){
  const c=cats.find(x=>x[1]===e.category)||["📦",e.category||"Ostatné"];
  const status=e.settlement_status||"Nevyrovnané";
  const statusIcon=status==="Platené spolu"?"🤝":status==="Vyrovnané"?"🟢":"🔴";
  return `<div class="exp">
    <div class="ico">${c[0]}</div>
    <div class="info">
      <b>${esc(e.category||"Ostatné")} · ${money(e.amount)}</b>
      <small>${esc(e.note||"Bez poznámky")} · 👤 ${esc(e.payer||"")} · ${e.payment==="Hotovosť"?"💶":"💳"} · ${statusIcon}</small>
    </div>
    <div class="acts">
      <button type="button" class="ghost mini" onclick="openExpense('${e.id}')" aria-label="Upraviť">✏️</button>
      <button type="button" class="ghost mini" onclick="delExpense('${e.id}')" aria-label="Vymazať">🗑️</button>
    </div>
  </div>`;
}
function renderLists(){
  document.getElementById("today").innerHTML =
    expenses
      .filter(e=>e.expense_date===today())
      .map(row)
      .join("")
    || '<div class="muted" style="padding-top:12px">Dnes zatiaľ žiadny výdavok.</div>';

  document.getElementById("history").innerHTML =
    [...expenses]
      .sort((a,b)=>new Date(b.expense_date)-new Date(a.expense_date))
      .slice(0,15)
      .map(row)
      .join("")
    || '<div class="muted" style="padding-top:12px">Zatiaľ žiadne výdavky.</div>';

  const dl = dateList();

  document.getElementById("days").innerHTML =
    dl.length
      ? dl.map((d,i)=>{
          const v =
            expenses
              .filter(e=>e.expense_date===d && !e.fixed)
              .reduce((a,e)=>a+Number(e.amount||0),0);

          return `
            <div class="day ${d===today()?"selected":""}">
              <small>${i+1}. deň</small>
              <b>${money(v)}</b>
            </div>
          `;
        }).join("")
      : "<span class='muted'>Nastav dátumy.</span>";
}

function paidBy(person){
  return expenses
    .filter(e=>
      (e.payer||"")===person &&
      (e.settlement_status||"Nevyrovnané")!=="Vyrovnané"
    )
    .reduce((a,e)=>a+Number(e.amount||0),0);
}

function renderSettlement(){
  const el=document.getElementById("settle");
  if(!el) return;

  const p1=trip.person1||"Ja";
  const p2=trip.person2||"Partner";

  let p1Share=0;
  let p2Share=0;
  let p1Paid=0;
  let p2Paid=0;

  expenses.forEach(e=>{
    const amount=Number(e.amount||0);
    const status=e.settlement_status||"Nevyrovnané";

    if(status==="Vyrovnané") return;

    if(status==="Platené spolu"){
      p1Share += amount/2;
      p2Share += amount/2;
      p1Paid += amount/2;
      p2Paid += amount/2;
      return;
    }

    if(e.payer===p1){
      p1Paid += amount;
      p1Share += amount/2;
      p2Share += amount/2;
    }else if(e.payer===p2){
      p2Paid += amount;
      p1Share += amount/2;
      p2Share += amount/2;
    }
  });

  const balance1=p1Paid-p1Share;
  const balance2=p2Paid-p2Share;

  if(Math.abs(balance1)<0.005){
    el.innerHTML =
      '<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>Ste vyrovnaní</b></div>';
    return;
  }

  if(balance1>0){
    el.innerHTML =
      `<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>${esc(p2)} má doplatiť ${money(balance1)}</b></div>`;
  }else{
    el.innerHTML =
      `<div class="kpi accent"><small>⚖️ Vyrovnanie</small><b>${esc(p1)} má doplatiť ${money(Math.abs(balance1))}</b></div>`;
  }
}

function renderCategories(){
  const el=document.getElementById("categorySummary");
  if(!el) return;

  const totals={};

  expenses.forEach(e=>{
    const name=e.category||"Ostatné";
    totals[name]=(totals[name]||0)+Number(e.amount||0);
  });

  const rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]);

  if(!rows.length){
    el.innerHTML='<div class="muted" style="padding-top:12px">Zatiaľ žiadne výdavky.</div>';
    return;
  }

  const total=rows.reduce((s,x)=>s+x[1],0);

  el.innerHTML=rows.map(([name,value])=>{
    const pct=total>0 ? value/total*100 : 0;

    return `
      <div class="category-row">
        <div class="category-row-head">
          <span>${categoryEmoji(name)} ${esc(name)}</span>
          <b>${money(value)} · ${pct.toFixed(0)} %</b>
        </div>
        <div class="category-track">
          <i style="width:${pct}%"></i>
        </div>
      </div>
    `;
  }).join("");
}

function copyShare(){
  navigator.clipboard
    .writeText(location.href)
    .then(()=>alert("Odkaz bol skopírovaný."))
    .catch(()=>alert(location.href));
}

function openExpense(id){
editing=id?expenses.find(e=>e.id===id):null;
cat=editing?.category||"Jedlo";
document.getElementById("modalTitle").textContent=editing?"Upraviť výdavok":"Pridať výdavok";
document.getElementById("amount").value=editing?.amount||"";
document.getElementById("date").value=editing?.expense_date||today();
document.getElementById("note").value=editing?.note||"";
document.getElementById("fixed").checked=!!editing?.fixed;
document.getElementById("payment").value=editing?.payment||"Karta";
document.getElementById("settlement").value=editing?.settlement_status||"Nevyrovnané";
document.getElementById("payer").innerHTML=`<option>${esc(trip.person1)}</option><option>${esc(trip.person2)}</option>`;
document.getElementById("payer").value=editing?.payer||trip.person1;
renderCats();
document.getElementById("modal").classList.add("open")
}
function selectCategory(index, event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }

  const item = cats[Number(index)];
  if(!item) return;

  cat = item[1];

  document.querySelectorAll("#cats .cat").forEach(function(btn){
    const selected = Number(btn.dataset.catIndex) === Number(index);
    btn.classList.toggle("sel", selected);
    btn.setAttribute("aria-pressed", selected ? "true" : "false");
  });
}

function renderCats(){
  const el = document.getElementById("cats");

  el.innerHTML = cats.map(function(x,i){
    return `
      <button
        type="button"
        class="cat ${cat === x[1] ? "sel" : ""}"
        data-cat-index="${i}"
        aria-pressed="${cat === x[1] ? "true" : "false"}"
        onclick="selectCategory(${i}, event)"
      >
        <span>${x[0]}</span>
        ${x[1]}
      </button>
    `;
  }).join("");
}

async function saveExpense(){let amount=Number(document.getElementById("amount").value);if(!amount)return alert("Zadaj sumu.");let obj={p_share_code:trip.share_code,p_amount:amount,p_category:cat,p_expense_date:document.getElementById("date").value,p_note:document.getElementById("note").value.trim(),p_fixed:document.getElementById("fixed").checked,p_payer:document.getElementById("payer").value,p_payment:document.getElementById("payment").value,p_settlement_status:document.getElementById("settlement").value};let r=editing?await db.rpc("update_expense",{...obj,p_expense_id:editing.id}):await db.rpc("add_expense",obj);if(r.error)return alert(r.error.message);closeModal();await load();render()}
async function delExpense(id){if(!confirm("Vymazať výdavok?"))return;let r=await db.rpc("delete_expense",{p_share_code:trip.share_code,p_expense_id:id});if(r.error)return alert(r.error.message);await load();render()}
function openSettings(){sname.value=trip.name;sbudget.value=trip.budget;sp1.value=trip.person1;sp2.value=trip.person2;sstart.value=trip.start_date||"";send.value=trip.end_date||"";document.getElementById("settings").classList.add("open")}
async function saveSettings(){if(sstart.value&&send.value&&send.value<sstart.value)return alert("Koniec nemôže byť pred začiatkom.");let r=await db.rpc("update_trip",{p_share_code:trip.share_code,p_name:sname.value,p_budget:Number(sbudget.value)||0,p_person1:sp1.value||"Ja",p_person2:sp2.value||"Partner",p_start_date:sstart.value||null,p_end_date:send.value||null});if(r.error)return alert(r.error.message);closeSettings();await load();render()}
function closeModal(){document.getElementById("modal").classList.remove("open")}function closeSettings(){document.getElementById("settings").classList.remove("open")}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
init()
